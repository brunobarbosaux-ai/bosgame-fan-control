# Bosgame M5 Fan Control Configuration
# Edit this file to customize your fan curves

# Power Mode: quiet, balanced, performance
POWER_MODE="balanced"

# Fan Mode for all fans: auto, fixed, curve
FAN_MODE="curve"

# Fan curve thresholds, measured against the EC temperature sensor
# (/sys/class/ec_su_axb35/temp1/temp), which reads 2-4 C below Tctl.
#
# The EC has six fixed duty steps only:
#   level 0 = 0 %   level 1 = 20 %   level 2 = 40 %
#   level 3 = 60 %  level 4 = 80 %   level 5 = 100 %
#
# Ramp-up: level rises when temp >= rampup[level+1]
# Ramp-down: level falls when temp <= rampdown[level]
# Ramp-down MUST stay below ramp-up, otherwise the fan oscillates.
#
# Steady floor profile: level 1 latches at 45 C and is only released below
# 40 C, so the fans hold a constant 20 % (~1500 RPM) at idle instead of
# stopping and restarting every few minutes. 100 % arrives at 88 C, which
# keeps sustained loads away from the ~95 C throttle point.

# Ramp-up curve: 5 thresholds (C) for levels 1-5
RAMPUP_CURVE="45,58,68,78,88"

# Ramp-down curve: 5 thresholds (C) for levels 1-5
RAMPDOWN_CURVE="40,52,62,72,82"
